# Created by jb-toolkit; owned by the project. Keep the contract: CI runs
# scripts/check and nothing else decides whether the project is healthy (R5).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tui
            desktop
      - uses: oven-sh/setup-bun@v2
      - name: Tauri system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check
        run: scripts/check

  # jb-toolkit's standard checks (jb check --ci, secret scan); the build and
  # scripts/check stay in the job above, which needs this project's setup.
  standard:
    uses: Genoux/jb-toolkit/.github/workflows/verify.yml@main
    with:
      scripts-check: false
