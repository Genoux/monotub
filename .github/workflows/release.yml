# Created by jb-toolkit; owned by the project. Tag-driven (R4.3): push vX.Y.Z
# and this verifies, checks, builds and drafts a release. Publishing the draft
# is the owner's decision.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release whose manifest disagrees with its tag reports a version
      # nobody built.
      - name: Version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          found=$(.toolkit/version)
          if [ "$found" != "$expected" ]; then
            echo "manifest says $found, tag says $expected" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
      - name: Tauri system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # A tag can point at a commit CI never saw.
      - name: Check
        run: scripts/check

      - name: Build
        run: |
          mkdir -p dist
          if [ -x scripts/build ]; then scripts/build; fi

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # notes are the commit subjects since the previous tag (R4.4); GitHub's
          # generated notes add authors, PR links and a contributors list
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --format='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          flags="--draft --notes-file $RUNNER_TEMP/notes.md --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          files=$(find dist -maxdepth 1 -type f)
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $flags --title "$GITHUB_REF_NAME" $files
