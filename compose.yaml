services:
  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["1883:1883"]
    restart: unless-stopped
  server:
    image: ghcr.io/genoux/monotub-server:${MONOTUB_VERSION:-latest}
    ports: ["${HTTP_PORT:-8001}:8001"]
    environment:
      MQTT_URL: mqtt://mqtt:1883
    depends_on: [mqtt]
    restart: unless-stopped
