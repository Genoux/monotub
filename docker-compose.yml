services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  server:
    build:
      context: ./server
    ports:
      - "${HTTP_PORT:-8001}:8001"
    environment:
      MQTT_URL: mqtt://mqtt:1883
      HTTP_PORT: 8001
    depends_on:
      - mqtt
    restart: unless-stopped
