; PlatformIO Project Configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1

[env:esp32dev-relay-test]
extends = env:esp32dev
build_flags =
    -DRELAY_STRESS_TEST=1

; Flash over Wi-Fi after the first USB flash:
;   MONOTUB_OTA_HOST=monotub.local MONOTUB_OTA_PASSWORD=... pio run -e esp32dev-ota -t upload
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.MONOTUB_OTA_HOST}
upload_flags =
    --auth=${sysenv.MONOTUB_OTA_PASSWORD}
