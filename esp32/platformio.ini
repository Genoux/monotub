; PlatformIO Project Configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 921600

; Generates an OTA password into include/secrets.h when it is missing (see the script).
extra_scripts = pre:scripts/ota_password.py

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1
    tzapu/WiFiManager@^2.0.17

[env:esp32dev-relay-test]
extends = env:esp32dev
build_flags =
    -DRELAY_STRESS_TEST=1

; Flash over Wi-Fi after the first USB flash; the password comes from include/secrets.h
; unless MONOTUB_OTA_PASSWORD is set:
;   MONOTUB_OTA_HOST=monotub.local pio run -e esp32dev-ota -t upload
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.MONOTUB_OTA_HOST}
; The board connects back to this port to pull the image; a fixed port can be opened in the
; host firewall (ufw allow from <lan> to any port 3233 proto tcp), a random one cannot.
upload_flags =
    --auth=${sysenv.MONOTUB_OTA_PASSWORD}
    --host_port=3233
