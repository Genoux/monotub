<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9b49b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Monotub">
<title>Monotub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap">
<style>
:root {
  --glass: #a9b49b; --glass-low: #97a389;
  --ink: #1c2316; --ink-dim: rgba(28, 35, 22, 0.28); --ink-ghost: rgba(28, 35, 22, 0.11);
  --ink-hover: rgba(28, 35, 22, 0.1); --ink-pressed-hover: #2e3826; --lit-shadow: rgba(28, 35, 22, 0.16);
}
* { box-sizing: border-box; }
html { background: var(--glass-low); }
html, body { margin: 0; }
button { font: inherit; color: inherit; }
body {
  min-height: 100dvh; background: linear-gradient(180deg, var(--glass), var(--glass-low));
  color: var(--ink); font-family: "Doto", monospace; font-weight: 900;
  -webkit-tap-highlight-color: transparent;
}

.app {
  position: relative; max-width: 940px; margin: 0 auto; display: grid; gap: 20px;
  padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
    calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar h1, .bar h2 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: 0.12em; }
.help-open, .help-close {
  width: 20px; height: 20px; padding: 0 0 0 1.5px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  background: transparent; border: 1px solid var(--ink); font-size: 12px; line-height: 1;
}
.help-open:hover, .help-close:hover { background: var(--ink-hover); }
.app > .bar { align-items: flex-start; }
.help-open { width: 16px; height: 16px; padding: 0 0 0 1px; border: 0; font-size: 12px; }
.help-open:focus-visible, .help-close:focus-visible, .key:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.help {
  width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 0;
  background: var(--glass); color: var(--ink); border: 1px solid var(--ink); border-radius: 4px;
  font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-weight: 500; font-size: 13px; line-height: 1.5;
}
.help-sheet { padding: 16px 20px 18px; outline: none; }
.help::backdrop { background: rgba(0, 0, 0, 0.5); }
.help h2, .help h3 { font-family: "Doto", monospace; font-weight: 900; }
.help h3 { margin: 16px 0 6px; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
.help p, .help ul { margin: 0 0 6px; }
.help ul { padding-left: 18px; }
.help b { font-weight: 800; }
.help .now, .help tr.current td { background: var(--ink); color: var(--glass); }
.help .now { padding: 0 4px; }
.help table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.help th, .help td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--ink-dim); }
.help th { font-weight: 700; font-size: 12px; }

.display { display: flex; flex-direction: column; container-type: inline-size; }
.ann-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; }
.ann { display: flex; flex-wrap: wrap; gap: 0 10px; }
.ann span { font-size: 14px; line-height: 24px; text-transform: uppercase; color: var(--ink-dim); }
.ann span.on { color: var(--ink); }
.ann span.on, .unit, .temp { text-shadow: 1px 1.5px 0 var(--lit-shadow); }

.keys { display: flex; gap: 6px; margin-left: auto; }
.key {
  display: inline-grid; place-items: center; width: 58px; height: 24px; cursor: pointer;
  /* Doto glyphs carry ~3px of right bearing at 14px; the text sat 1.5px left of centre without this. */
  padding: 0 0 0 1.5px; border: 1px solid var(--ink); border-radius: 3px; background: transparent;
  font-size: 14px; line-height: 1; transition: background 0.12s, transform 0.06s;
}
.key:not(:disabled):hover { background: var(--ink-hover); }
.key:active { transform: scale(0.97); }
.key[aria-pressed="true"] { background: var(--ink); color: var(--glass); }
.key[aria-pressed="true"]:not(:disabled):hover { background: var(--ink-pressed-hover); }
.key:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
/* Locked keys keep full contrast so FAN and MIST still show what AUTO is doing; the title says why they ignore clicks. */
.key.locked { opacity: 1; }

.reading { display: flex; align-items: flex-end; gap: 8px; margin: 20px 0 12px; }
.reading svg.big { height: clamp(64px, 20cqi, 150px); width: auto; }
.temp { margin-left: auto; display: flex; align-items: flex-end; gap: 4px; }
.temp svg { height: clamp(30px, 8cqi, 60px); width: auto; }
.unit, .temp { font-size: 18px; padding-bottom: 4px; }
.seg { fill: var(--ink-ghost); }
.seg.on { fill: var(--ink); filter: drop-shadow(1.5px 2px 0 var(--lit-shadow)); }

.graph { position: relative; height: 56px; display: flex; align-items: flex-end; gap: 2px; }
.graph i { flex: 1; height: 100%; position: relative; background: repeating-linear-gradient(to top, var(--ink-ghost) 0 4px, transparent 4px 6px); }
.graph i::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--level, 0%);
  background: repeating-linear-gradient(to top, var(--ink) 0 4px, transparent 4px 6px);
}
.graph .edge { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink); opacity: 0.35; }
.graph-scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; }

.notice { margin: 0; font-size: 13px; }
.notice:empty { display: none; }

.plate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-top: 14px; border-top: 1px solid var(--ink-dim); font-size: 13px; color: rgba(28, 35, 22, 0.6); }
.plate b { display: block; margin-top: 6px; color: var(--ink); font-size: 15px; font-weight: 900; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; margin-right: 6px; vertical-align: -1px; }
.bars i { width: 3px; background: var(--ink); }
.bars i.off { opacity: 0.25; }

@media (max-width: 560px) {
  .plate { grid-template-columns: repeat(2, 1fr); }
}
/* Touch and narrow screens get full-width 44px switches; the widget is exactly 560px wide and keeps its own. */
@media (pointer: coarse), (max-width: 560px) {
  :root:not(.widget) .keys { width: 100%; gap: 8px; }
  :root:not(.widget) .key { flex: 1; width: auto; height: 44px; font-size: 16px; }
}

/* Desktop widget (/?widget): the same screen cut down to fill a 560x220 window (no plate or graph labels). */
.widget, .widget body { height: 100%; overflow: hidden; }
.widget body { min-height: 0; }
.widget .app { height: 100%; max-width: none; display: flex; flex-direction: column; gap: 0; padding: 12px 16px 10px; }
.widget .plate, .widget .graph-scale { display: none; }
.widget .bar { margin-bottom: 8px; }
.widget .display { flex: 1; min-height: 0; }
.widget .reading { margin: auto 0 6px; }
.widget .reading svg.big { height: 80px; }
.widget .temp svg { height: 34px; }
.widget .graph { height: 30px; }
.widget .notice { position: absolute; left: 16px; right: 16px; bottom: 6px; padding: 2px 6px; background: var(--glass-low); font-size: 12px; }
</style>
</head>
<body>

<main class="app" aria-label="Monotub control panel">
  <header class="bar">
    <h1>MONOTUB</h1>
    <button class="help-open" id="help-open" aria-label="How the automation works" aria-haspopup="dialog">?</button>
  </header>

  <section class="display" aria-live="polite">
    <div class="ann-row">
      <div class="ann" id="bands"></div>
      <div class="keys" role="group" aria-label="Controls">
        <button class="key" data-key="auto" aria-pressed="false">AUTO</button>
        <button class="key" data-key="fan" aria-pressed="false">FAN</button>
        <button class="key" data-key="mist" aria-pressed="false">MIST</button>
      </div>
    </div>
    <div class="reading">
      <svg class="big" id="rh-digits" role="img"></svg>
      <span class="unit">%RH</span>
      <div class="temp"><svg id="temp-digits" role="img"></svg><span>°C</span></div>
    </div>
    <div class="graph" id="graph"></div>
    <div class="graph-scale"><span>2 min ago</span><span>now</span></div>
  </section>

  <p class="notice" id="notice" role="status"></p>

  <footer class="plate">
    <div>Signal<b><span class="bars" id="signal-bars"><i style="height:30%"></i><i style="height:55%"></i><i style="height:80%"></i><i style="height:100%"></i></span><span id="rssi">—</span></b></div>
    <div>Address<b id="address">—</b></div>
    <div>Running for<b id="uptime">—</b></div>
    <div>Last report<b id="last-report">—</b></div>
  </footer>
</main>

<dialog class="help" id="help" aria-labelledby="help-title">
  <div class="help-sheet" tabindex="-1" autofocus>
    <header class="bar">
      <h2 id="help-title">How it works</h2>
      <button class="help-close" id="help-close" aria-label="Close">×</button>
    </header>
    <div id="help-body"></div>
  </div>
</dialog>

<script>
const POLL_MS = 2000;
const GRAPH_BARS = 60;
const BAND_LABELS = ["dry", "recovering", "healthy", "drying", "wet"];
const KEY_REQUESTS = {
  auto: (pressed) => ["/automation-settings", { automation_enabled: !pressed }],
  fan: (pressed) => ["/fan", { enabled: !pressed }],
  mist: (pressed) => ["/mist", { enabled: !pressed }],
};

const KEY_EXPECTED_STATE = {
  auto: (state, on) => ({ ...state, desired: { ...state.desired, automation_enabled: on } }),
  fan: (state, on) => ({ ...state, fan: on ? "ON" : "OFF" }),
  mist: (state, on) => ({ ...state, mist: on ? "ON" : "OFF" }),
};

let snapshot = null;
let serverError = null;
let keyError = null;
// Bumped by every key press; a poll that started before one would undo its optimistic state.
let keyGeneration = 0;
let history = [];
const byId = (id) => document.getElementById(id);
// The desktop shell opens /?widget: the same screen without the plate and graph labels.
document.documentElement.classList.toggle("widget", new URLSearchParams(location.search).has("widget"));

const horizontal = (y, x1, x2) => `${x1},${y} ${x1 + 5},${y - 5} ${x2 - 5},${y - 5} ${x2},${y} ${x2 - 5},${y + 5} ${x1 + 5},${y + 5}`;
const vertical = (x, y1, y2) => `${x},${y1} ${x + 5},${y1 + 5} ${x + 5},${y2 - 5} ${x},${y2} ${x - 5},${y2 - 5} ${x - 5},${y1 + 5}`;
const SEGMENT_SHAPES = {
  a: horizontal(8, 12, 48), g: horizontal(50, 12, 48), d: horizontal(92, 12, 48),
  f: vertical(10, 10, 48), b: vertical(50, 10, 48), e: vertical(10, 52, 90), c: vertical(50, 52, 90),
};
const DIGIT_SEGMENTS = {
  "0": "abcdef", "1": "bc", "2": "abdeg", "3": "abcdg", "4": "bcfg",
  "5": "acdfg", "6": "acdefg", "7": "abc", "8": "abcdefg", "9": "abcdfg", "-": "g",
};
const DIGIT_WIDTH = 68;

function drawDigits(svg, text) {
  const glyphs = [...text].reduce((list, char) => {
    if (char === "." && list.length) list[list.length - 1].point = true;
    else list.push({ char, point: false });
    return list;
  }, []);
  svg.innerHTML = glyphs.map((glyph, index) => {
    const lit = DIGIT_SEGMENTS[glyph.char] ?? "";
    const segments = Object.entries(SEGMENT_SHAPES)
      .map(([name, points]) => `<polygon class="seg${lit.includes(name) ? " on" : ""}" points="${points}"/>`).join("");
    return `<g transform="translate(${index * DIGIT_WIDTH + 10} 0) skewX(-7)">${segments}<circle class="seg${glyph.point ? " on" : ""}" cx="60" cy="92" r="5"/></g>`;
  }).join("");
  svg.setAttribute("viewBox", `0 0 ${glyphs.length * DIGIT_WIDTH + 12} 100`);
  svg.setAttribute("aria-label", text);
}

const isNumber = (value) => typeof value === "number" && Number.isFinite(value);

const FIRMWARE_BAND_LABELS = {
  too_dry: "dry", recovering: "recovering", healthy: "healthy", drying: "drying", too_wet: "wet",
};

function bandEdges(status) {
  const edges = [status?.rh_dry_below, status?.rh_band_low, status?.rh_band_high, status?.rh_wet_above];
  return edges.every(isNumber) ? edges : null;
}

// current_band is the band the firmware has engaged (after its hold time), so it
// matches what the relays are doing; the raw reading can sit in a neighbour band.
function bandFor(status, edges) {
  const engaged = FIRMWARE_BAND_LABELS[status?.current_band];
  if (engaged) return engaged;
  const humidity = status?.humidity_percent;
  if (!isNumber(humidity) || !edges) return null;
  const index = edges.findIndex((edge) => humidity < edge);
  return BAND_LABELS[index === -1 ? edges.length : index];
}

function formatUptime(seconds) {
  if (!isNumber(seconds)) return "—";
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  if (days) return `${days} d ${hours} h`;
  if (hours) return `${hours} h ${minutes} m`;
  return `${minutes} m`;
}

function formatAgo(iso) {
  if (!iso) return "never";
  const seconds = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (seconds < 3) return "just now";
  if (seconds < 120) return `${seconds} s ago`;
  if (seconds < 7200) return `${Math.round(seconds / 60)} min ago`;
  return `${Math.round(seconds / 3600)} h ago`;
}

const signalBarCount = (rssi) => !isNumber(rssi) ? 0 : rssi > -55 ? 4 : rssi > -65 ? 3 : rssi > -75 ? 2 : 1;

function keyStates(state) {
  const status = state?.status;
  return {
    auto: state?.desired?.automation_enabled ?? status?.automation_enabled ?? false,
    fan: state?.fan === "ON",
    mist: state?.mist === "ON",
  };
}

function noticeText() {
  if (serverError) return `Server unreachable: ${serverError}`;
  if (keyError) return keyError;
  if (snapshot?.connected === "offline") return "Device offline — showing its last report";
  if (snapshot && !snapshot.status) return "Waiting for the device to report";
  return "";
}

function renderGraph(edges) {
  const graphMin = Math.floor(Math.min(edges ? edges[0] - 1 : 80, ...history));
  const graphMax = Math.ceil(Math.max(edges ? edges[3] + 1 : 95, ...history));
  const levelFor = (value) => Math.min(Math.max((value - graphMin) / (graphMax - graphMin), 0.04), 1) * 100;
  const padded = [...Array(Math.max(GRAPH_BARS - history.length, 0)).fill(null), ...history];
  byId("graph").innerHTML =
    padded.map((value) => `<i style="--level:${value === null ? 0 : levelFor(value)}%"></i>`).join("") +
    (edges ? [edges[1], edges[2]].map((edge) => `<span class="edge" style="bottom:${levelFor(edge)}%"></span>`).join("") : "");
}

function render() {
  const status = snapshot?.status;
  const humidity = status?.humidity_percent;
  const temperature = status?.temperature_c;
  const edges = bandEdges(status);
  const band = bandFor(status, edges);
  const keys = keyStates(snapshot);
  const controlsLive = Boolean(status) && !serverError && snapshot.connected !== "offline";

  drawDigits(byId("rh-digits"), isNumber(humidity) ? humidity.toFixed(1).padStart(4, "0") : "--.-");
  drawDigits(byId("temp-digits"), isNumber(temperature) ? temperature.toFixed(1) : "--.-");
  byId("bands").innerHTML = BAND_LABELS.map((label) => `<span class="${label === band ? "on" : ""}">${label}</span>`).join("");
  renderGraph(edges);

  document.querySelectorAll("[data-key]").forEach((key) => {
    const name = key.dataset.key;
    key.setAttribute("aria-pressed", keys[name]);
    const locked = controlsLive && name !== "auto" && keys.auto;
    key.disabled = !controlsLive || locked;
    key.classList.toggle("locked", locked);
    key.title = locked ? "Controlled by AUTO" : "";
  });

  const barCount = signalBarCount(status?.rssi);
  [...byId("signal-bars").children].forEach((bar, index) => bar.classList.toggle("off", index >= barCount));
  byId("rssi").textContent = isNumber(status?.rssi) ? `${status.rssi} dBm` : "—";
  byId("address").textContent = status?.ip ?? "—";
  byId("uptime").textContent = formatUptime(status?.uptime_s);
  byId("last-report").textContent = formatAgo(snapshot?.lastSeenAt);
  byId("notice").textContent = noticeText();
  if (byId("help").open) renderHelp();
}

async function fetchState() {
  const generation = keyGeneration;
  try {
    const response = await fetch("/state", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const fetched = await response.json();
    if (generation !== keyGeneration) return;
    snapshot = fetched;
    serverError = null;
    const humidity = snapshot.status?.humidity_percent;
    if (isNumber(humidity)) history = [...history, humidity].slice(-GRAPH_BARS);
  } catch (error) {
    serverError = error.message;
  }
  render();
}

async function sendKey(name) {
  const pressed = keyStates(snapshot)[name];
  const [path, body] = KEY_REQUESTS[name](pressed);
  try {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) {
      const { error } = await response.json().catch(() => ({}));
      throw new Error(error ?? `HTTP ${response.status}`);
    }
    // Re-fetching here would beat the device's MQTT echo and show the old state until the next poll.
    keyGeneration += 1;
    keyError = null;
    snapshot = KEY_EXPECTED_STATE[name](snapshot, !pressed);
    render();
  } catch (error) {
    keyError = `${name.toUpperCase()} failed: ${error.message}`;
    await fetchState();
  }
}

// Firmware defaults (README › The Band Table), shown until the device reports its own values.
const DEFAULT_RULES = {
  rh_dry_below: 85, rh_band_low: 86, rh_band_high: 88, rh_wet_above: 92,
  band_hold_seconds: 10, vent_on_seconds: 5, vent_off_seconds: 90,
};

function rulesFrom(status) {
  const entries = Object.entries(DEFAULT_RULES).map(([field, fallback]) =>
    [field, isNumber(status?.[field]) ? status[field] : fallback]);
  const reported = Object.keys(DEFAULT_RULES).every((field) => isNumber(status?.[field]));
  return { ...Object.fromEntries(entries), reported };
}

const percent = (value) => isNumber(value) ? `${Number(value.toFixed(1))}%` : "—";

function helpNow(status) {
  if (!status) return "<p>No report from the device yet.</p>";
  const keys = keyStates(snapshot);
  const humidity = isNumber(status.smoothed_humidity_percent) ? status.smoothed_humidity_percent : status.humidity_percent;
  const band = bandFor(status, bandEdges(status));
  const settling = isNumber(status.band_hold_remaining_s) && status.band_hold_remaining_s > 0
    ? ` A band change is settling: ${status.band_hold_remaining_s} s left.` : "";
  const mode = keys.auto
    ? `Automation is <b>on</b>. ${band ? `Smoothed RH ${percent(humidity)}, engaged band <b class="now">${band}</b>.` : `Smoothed RH ${percent(humidity)}; the band shows once the firmware reports it.`}${settling}`
    : "Automation is <b>off</b>: FAN and MIST are manual and humidity changes nothing.";
  const simulation = status.simulation_enabled ? ` <b>Simulation is on</b>: the rules use ${percent(status.simulated_humidity_percent)}, not the sensor.` : "";
  return `<p>${mode} Mist is <b>${keys.mist ? "on" : "off"}</b>, fan is <b>${keys.fan ? "on" : "off"}</b>.${simulation}</p>`;
}

function helpBandRows(rules, currentBand) {
  const { rh_dry_below: dry, rh_band_low: low, rh_band_high: high, rh_wet_above: wet } = rules;
  const nudge = `${rules.vent_on_seconds} s on / ${rules.vent_off_seconds} s off`;
  return [
    ["dry", `below ${percent(dry)}`, "on", "off"],
    ["recovering", `${percent(dry)} – ${percent(low)}`, "keeps its state", "off"],
    ["healthy", `${percent(low)} – ${percent(high)}`, "keeps its state", "off"],
    ["drying", `${percent(high)} – ${percent(wet)}`, "off", nudge],
    ["wet", `${percent(wet)} and above`, "off", nudge],
  ].map(([band, range, mist, fan]) =>
    `<tr class="${band === currentBand ? "current" : ""}"><td>${band}</td><td>${range}</td><td>${mist}</td><td>${fan}</td></tr>`).join("");
}

function renderHelp() {
  const status = snapshot?.status;
  const rules = rulesFrom(status);
  const currentBand = bandFor(status, bandEdges(status));
  byId("help-body").innerHTML = `
    <h3>Right now</h3>
    ${helpNow(status)}
    <h3>Bands</h3>
    <p>With AUTO on, the firmware sorts the smoothed humidity into a band and each band always does the same thing.${rules.reported ? "" : " <b>Showing firmware defaults</b>: the device has not reported its own values (it needs the band-model firmware)."}</p>
    <table>
      <thead><tr><th>Band</th><th>Humidity</th><th>Mist</th><th>Fan</th></tr></thead>
      <tbody>${helpBandRows(rules, currentBand)}</tbody>
    </table>
    <h3>Rules</h3>
    <ul>
      <li><b>Mist</b> turns on below ${percent(rules.rh_dry_below)} and off at or above ${percent(rules.rh_band_high)}. In between it keeps whatever it was doing, so it never flickers around one number.</li>
      <li><b>Fan</b> only nudges when it is too wet: ${rules.vent_on_seconds} s on, ${rules.vent_off_seconds} s off, at or above ${percent(rules.rh_band_high)}. It stops once humidity is back below that and has settled.</li>
      <li><b>Settling</b>: a new band must hold for ${rules.band_hold_seconds} s before its action starts, so a short spike changes nothing.</li>
      <li><b>Sensor failure</b>: with AUTO on and no readable humidity, the firmware keeps mist <b>on</b> and the fan off until the sensor answers again.</li>
      <li><b>AUTO off</b> is service mode: FAN and MIST toggle the relays directly and the bands are ignored.</li>
      <li><b>Restarts and updates</b>: both relays stay off for 5 s after the board boots and during a firmware update.</li>
    </ul>`;
}

byId("help-open").addEventListener("click", () => {
  renderHelp();
  byId("help").showModal();
});
byId("help-close").addEventListener("click", () => byId("help").close());
// A target check alone also fires on the dialog's scrollbar and on drags released outside.
byId("help").addEventListener("click", (event) => {
  const box = event.currentTarget.getBoundingClientRect();
  const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
  if (event.target === event.currentTarget && outside) event.currentTarget.close();
});

document.querySelectorAll("[data-key]").forEach((key) =>
  key.addEventListener("click", () => sendKey(key.dataset.key)));

fetchState();
setInterval(fetchState, POLL_MS);
</script>
</body>
</html>
